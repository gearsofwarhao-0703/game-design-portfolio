="25" fill="white">10</text><circle cx="1000" cy="398" r="27" fill="#277CA5" stroke="white" stroke-width="4"/><text x="982" y="405.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="white">11</text><circle cx="1000" cy="299" r="27" fill="#277CA5" stroke="white" stroke-width="4"/><text x="982" y="306.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="white">12</text><text x="70" y="217.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">北 ↑  +z  东 →  +x</text><text x="70" y="257.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">路线与世界坐标一致</text><text x="70" y="298.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">道路宽 26 m</text><text x="410" y="1107.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">06 货车起点 x 0 z 126</text><text x="410" y="1147.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">两辆追车从后方跟进</text><text x="410" y="1188.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">后视镜持续显示实际后方画面</text><text x="80" y="827.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">07 右转</text><text x="80" y="867.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">x 0 z 380</text><text x="1150" y="887.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">08 左转</text><text x="1150" y="927.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">x 230 z 380</text><text x="1150" y="677.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">09 甩脱后自动广播</text><text x="1150" y="717.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">须按顺序通过两个街口</text><text x="1150" y="758.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">向前拉开距离，无需停车或按 R</text><text x="1150" y="477.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">10 蓝色调查区 x 230 z 730</text><text x="1150" y="517.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">广播结束后靠边停车</text><text x="1150" y="558.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">下车到货车后门按 E 看账册</text><text x="1150" y="247.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">12 警员 x 230 z 932</text><text x="1150" y="287.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">停车下车交账册</text><text x="1150" y="328.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#172B3B">结算可点击或 Enter 返回菜单</text><text x="70" y="435.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#172B3B">施工坡道 z 247</text><text x="70" y="472.5" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#172B3B">足够速度触发短飞跃</text><text x="70" y="510.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#172B3B">与完整侧滚，落地恢复驾驶</text><text x="70" y="1245.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#172B3B">金色为逃脱路线，蓝色为获知真相后的送证路线；图中转角与程序使用相同坐标。</text></svg>