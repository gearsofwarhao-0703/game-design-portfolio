<text x="550.9000000000001" y="244" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#20312F" text-anchor="start">解除双锁后前往 H</text>
<text x="153" y="518" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#546762" text-anchor="start">周边栏杆</text>
<text x="153" y="587" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#546762" text-anchor="start">无跌落秒杀</text>
<text x="1050" y="238" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#20312F" text-anchor="start">同一规则  两次考核</text>
<text x="1050" y="304" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#20312F" text-anchor="start">1  诱导重踏</text>
<text x="1050" y="348" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">在钟旁诱导落点，钟守距钟 4–7 m。</text>
<text x="1050" y="383" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">最后 0.7 s 不再追踪玩家。</text>
<text x="1050" y="473" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#20312F" text-anchor="start">2  躲开并敲钟</text>
<text x="1050" y="517" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">落地导声状态持续 2.8 s。</text>
<text x="1050" y="552" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">在 12 m 范围内敲钟，锁芯暴露 6 s。</text>
<text x="1050" y="642" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#20312F" text-anchor="start">3  命中暴露锁芯</text>
<text x="1050" y="686" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">第一锁在胸前，第二锁在背部。</text>
<text x="1050" y="721" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">落地后保持朝向，允许清楚绕背。</text>
<text x="1050" y="811" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#20312F" text-anchor="start">4  失误可以重试</text>
<text x="1050" y="855" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">未破锁，不消耗钟。</text>
<text x="1050" y="890" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#546762" text-anchor="start">两次成功分别使用两座钟即可。</text>
<text x="1050" y="1016" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#20312F" text-anchor="start">图例</text>
